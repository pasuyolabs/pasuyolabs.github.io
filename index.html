<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PasuyoLabs</title>
<meta name="description" content="PasuyoLabs makes simple, useful Android apps.">
<style>
  :root{--bg:#0f1420;--card:#171e2e;--text:#eef1f7;--muted:#9aa4b8;--accent:#f5a623}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  main{max-width:760px;margin:0 auto;padding:56px 16px}
  h1{font-size:2.4rem;margin:0}
  h1 span{color:var(--accent)}
  .lead{color:var(--muted);margin:8px 0 40px}
  h2{font-size:1.1rem;color:var(--muted);font-weight:600;margin:0 0 14px}
  .app{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px}
  .icon{width:56px;height:56px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-size:28px;flex:none}
  .app h3{margin:0;font-size:1.1rem}
  .app p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
  a{color:var(--accent)}
  .btn{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:999px;background:var(--accent);color:#111;text-decoration:none;font-weight:600;font-size:.9rem}
  footer{margin-top:48px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Pasuyo<span>Labs</span></h1>
  <p class="lead">Simple, useful apps for everyday life.</p>

  <h2>Our apps</h2>
  <div class="app">
    <div class="icon">⏰</div>
    <div>
      <h3>To Do Alarm</h3>
      <p>A to-do list with a real alarm for every task. Never miss what matters.</p>
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.pasuyolabs.todoalarm">Get it on Google Play</a>
      <p><a href="https://pasuyobuddy.github.io/to-do-app/privacy-policy.html">Privacy policy</a></p>
    </div>
  </div>

  <footer>
    <p>Contact: <a href="mailto:pasuyolabs@gmail.com">pasuyolabs@gmail.com</a></p>
    <p>© 2026 PasuyoLabs</p>
  </footer>
</main>
</body>
</html>
